<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <style>
        :root {
            --bg: #09090b;
            --text: #f4f4f5;
            --text-secondary: #a1a1aa;
            --brand: #1dab70;
            --surface: #121214;
            --border: #27272a;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #fcfcfc;
                --text: #09090b;
                --text-secondary: #52525b;
                --surface: #ffffff;
                --border: #e4e4e7;
            }
        }
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
        }
        h1 {
            font-size: 8rem;
            margin: 0;
            font-weight: 800;
            color: var(--brand);
            line-height: 1;
            letter-spacing: -0.04em;
        }
        h2 {
            font-size: 1.5rem;
            margin: 1rem 0;
            font-weight: 600;
        }
        p {
            color: var(--text-secondary);
            max-width: 400px;
            margin: 0 auto 2rem;
            line-height: 1.6;
        }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background-color: var(--brand);
            color: white;
            border: none;
            border-radius: 99px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>500</h1>
    <h2>Internal Server Error</h2>
    <p>We're experiencing some technical difficulties. Our team has been notified. Please try again in a few minutes.</p>
    <button onclick="window.location.reload()">Reload Page</button>
</body>
</html>
